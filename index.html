<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpeakUp - English Tutor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <span class="logo">🗣 SpeakUp</span>
        <span class="tagline">AI English Tutor</span>
      </div>
      <div class="header-right">
        <select id="level">
          <option value="beginner">Beginner</option>
          <option value="intermediate" selected>Intermediate</option>
          <option value="advanced">Advanced</option>
        </select>
        <button id="stop-btn" title="Stop speaking">🔇 Stop</button>
      </div>
    </div>

    <!-- Practice modes -->
    <div class="modes">
      <button class="mode-btn active" data-mode="free">💬 Free Chat</button>
      <button class="mode-btn" data-mode="interview">💼 Interview</button>
      <button class="mode-btn" data-mode="travel">✈️ Travel</button>
      <button class="mode-btn" data-mode="grammar">📝 Grammar</button>
      <button class="mode-btn" data-mode="story">📖 Story</button>
      <button class="mode-btn" data-mode="debate">🎤 Debate</button>
    </div>

    <!-- Voice settings bar -->
    <div class="voice-bar">
      <label for="voice-select">🔊 Voice:</label>
      <select id="voice-select"></select>
      <label for="rate-range">Speed:</label>
      <input type="range" id="rate-range" min="0.5" max="1.5" step="0.1" value="0.95">
      <span id="rate-label">0.95x</span>
    </div>

    <!-- Chat messages -->
    <div class="messages" id="messages">
      <div class="message ai">
        <div class="avatar">🤖</div>
        <div class="content">
          <div class="bubble">Hi! I'm your English tutor. Choose a practice mode above, pick your level, and start talking or typing. I'll have a real conversation with you and give you grammar tips along the way! 😊</div>
        </div>
      </div>
    </div>

    <!-- Input area -->
    <div class="input-area">
      <button id="mic-btn">🎤 Speak</button>
      <textarea id="user-input" placeholder="Type your message or click Speak..." rows="2"></textarea>
      <button id="send-btn">Send ➤</button>
    </div>

  </div>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
